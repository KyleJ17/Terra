<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Terra – Pinpoint It</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;--bg:#07111f;--card:#0f1f36;--line:#1d3454;--tx:#e8f0fb;--mut:#8aa0bd;--acc:#4fb3ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 0,#10284a,var(--bg) 60%) fixed;color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:16px 16px 40px;text-align:center}
h1{margin:6px 0 2px;font-size:28px;letter-spacing:.18em;text-transform:uppercase;font-weight:800}
h1 span{color:var(--acc)}
p.sub{margin:0 0 10px;color:var(--mut);font-size:14px}
#globe{overflow:hidden;border-radius:50%;width:min(100%,460px);aspect-ratio:1;margin:0 auto;cursor:grab;touch-action:none;filter:drop-shadow(0 20px 40px rgba(30,120,255,.25))}
#globe:active{cursor:grabbing}
#globe svg{width:100%;height:100%}
.row{display:flex;gap:8px;margin:14px 0 6px}
input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:13px 14px;font-size:16px;outline:none}
input:focus{border-color:var(--acc)}
button:disabled{opacity:.45;cursor:default}
button{background:var(--acc);color:#04121f;border:0;border-radius:12px;padding:0 18px;font-weight:700;font-size:15px;cursor:pointer}
button.ghost{background:transparent;color:var(--mut);border:1px solid var(--line);padding:9px 14px;font-weight:600;font-size:13px}
#msg{min-height:22px;color:var(--mut);font-size:14px;margin:4px 0 8px}
#list{display:flex;flex-direction:column;gap:6px;text-align:left}
.g{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:15px}
.g i{width:14px;height:14px;border-radius:50%;flex:none}
.g b{flex:1;font-weight:600}.g em{font-style:normal;color:var(--mut);font-variant-numeric:tabular-nums}
.g.new{border-color:var(--acc)}
.legend{display:flex;align-items:center;gap:8px;justify-content:center;font-size:12px;color:var(--mut);margin:10px 0}
.legend div{width:140px;height:8px;border-radius:4px;background:linear-gradient(90deg,#7a0a1a,#d7301f,#fc8d59,#fdcc8a,#fff3d6)}
</style></head><body><main>
<h1>Ter<span>ra</span></h1>
<p class="sub">Everyone gets the same 5 landmarks today. Zoom in, drop your pin, and climb the leaderboard.</p>
<div id="bar" style="display:flex;justify-content:space-between;font-weight:700;font-size:14px;margin:6px 4px 10px;color:var(--mut)"><span id="rd"></span><span id="mode" style="color:var(--acc)"></span><span id="sc"></span></div>
<div id="globe"></div>
<div style="display:flex;gap:12px;justify-content:center;align-items:center;margin-top:12px"><button id="zo" style="width:46px;height:46px;border-radius:50%;font-size:24px;padding:0">−</button><input id="zs" type="range" min="0" max="100" value="0" style="flex:1;max-width:240px;padding:0;accent-color:#4fb3ff"><button id="zi" style="width:46px;height:46px;border-radius:50%;font-size:24px;padding:0">+</button><span id="zl" style="min-width:42px;color:var(--mut);font-size:13px">1×</span></div>
<p style="margin:6px 0 0;color:var(--mut);font-size:12px">Scroll, pinch, double-tap, drag the slider, or press + / −</p>
<div class="legend" style="display:none">Close <div></div> Far</div>
<div class="row" style="margin-top:12px"><button id="go" style="flex:1;padding:14px" disabled>Tap the globe to drop a pin</button></div>
<div id="clue" style="background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0 0;font-size:15px;line-height:1.4"></div>
<div id="msg">Loading the world…</div>
<div id="namebox" style="display:none;margin-top:14px"><div class="row" style="margin:0"><input id="nm" maxlength="20" placeholder="Your name for the leaderboard"><button id="post">Post score</button></div></div>
<div id="list"></div>
<h2 style="margin:28px 0 8px;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)">Today’s leaderboard</h2><div id="lb" style="display:flex;flex-direction:column;gap:6px;text-align:left"><div class="g" style="color:var(--mut)">Loading…</div></div>
<div style="margin-top:16px;display:flex;gap:8px;justify-content:center"><button class="ghost" id="again">Practice round</button></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.17/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/1.6.9/topojson.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/datamaps/0.5.9/datamaps.world.min.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)},msg=$('msg'),R=6371,N=5;
var ALL=[],DAILY=[];
var TODAY=new Date().toISOString().slice(0,10);
var CID=localStorage.getItem('terra-id');if(!CID){CID=(window.crypto&&crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now());localStorage.setItem('terra-id',CID)}
var DEF='#243752',scale=d3.scale.linear().domain([0,100,1000,3000,7000,14000]).range(['#2fbf71','#e8ab1d','#d7301f','#fc8d59','#fdcc8a','#fff3d6']);
var projection,path,target,rounds=[],set=[],idx=0,total=0,phase='guess',pend=null,rot=[0,-15],zoom=1,daily=true,played=false,guesses=[];
var el=$('globe'),W=el.clientWidth||460,RAD=W/2-6,ZMAX=40;
var map=new Datamap({element:el,fills:{defaultFill:DEF},
 geographyConfig:{popupOnHover:false,highlightOnHover:false,borderWidth:.4,borderColor:'#0b1a2e'},
 setProjection:function(e){
  projection=d3.geo.orthographic().scale(RAD).translate([W/2,W/2]).clipAngle(90).rotate(rot);
  path=d3.geo.path().projection(projection);return{path:path,projection:projection};}});
var svg=map.svg;
var defs=svg.insert('defs','g');
var gr=defs.append('radialGradient').attr('id','oc').attr('cx','35%').attr('cy','30%').attr('r','80%');
gr.append('stop').attr('offset','0').attr('stop-color','#1b4f8f');gr.append('stop').attr('offset','1').attr('stop-color','#0a2447');
var ocean=svg.insert('circle','defs + g').attr('cx',W/2).attr('cy',W/2).attr('r',RAD).style('fill','url(#oc)');
var nodes=svg.selectAll('.datamaps-subunit');
var arcs=svg.append('g'),pins=svg.append('g');
function hav(a,b){var r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lon-a.lon)*r;
 var h=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)*Math.sin(dn/2);return Math.round(2*R*Math.asin(Math.sqrt(h)))}
function fmt(n){return n.toLocaleString()+' km'}
function redraw(){nodes.attr('d',path);arcs.selectAll('path').attr('d',function(d){return path(d)});
 var c=projection.invert([W/2,W/2]);
 pins.selectAll('circle').each(function(d){var p=projection([d.lon,d.lat]),v=d3.geo.distance(c,[d.lon,d.lat])<Math.PI/2-.001;
  d3.select(this).attr('cx',p[0]).attr('cy',p[1]).style('display',v?null:'none')})}
function setZoom(z){zoom=Math.max(1,Math.min(ZMAX,z));projection.scale(RAD*zoom);ocean.attr('r',RAD*zoom);
 $('zl').textContent=(zoom<10?zoom.toFixed(1):Math.round(zoom))+'\u00d7';$('zs').value=Math.round(Math.log(zoom)/Math.log(ZMAX)*100);redraw()}
function look(p,z){rot=[-p.lon,-p.lat];projection.rotate(rot);setZoom(z||zoom)}
function zoomAt(q,f,t){ // zoom by factor f, drifting the view toward point q
 if(q){var dl=-q[0]-rot[0];dl=((dl+540)%360)-180;rot=[rot[0]+dl*t,rot[1]+(-q[1]-rot[1])*t];projection.rotate(rot)}
 setZoom(zoom*f)}
function addPin(p,col,r,cls){return pins.append('circle').datum(p).attr('class',cls||'').attr('r',r).style('fill',col).style('stroke','#fff').style('stroke-width',2).style('pointer-events','none')}
function pts(d){return Math.round(5000*Math.exp(-Math.max(0,d-25)/2000))}
function hud(){$('rd').textContent='Round '+Math.min(idx+1,N)+' / '+N;$('sc').textContent='Score '+total.toLocaleString();
 $('mode').textContent=daily&&!played?'Daily \u00b7 '+TODAY:'Practice'}
function setClue(){$('clue').innerHTML='<div style="color:var(--mut);font-size:12px;letter-spacing:.12em;text-transform:uppercase">Drop a pin on</div><div style="font-size:22px;font-weight:800;margin:4px 0">'+target.name+'</div><div style="color:var(--mut);font-size:14px">'+target.clue+'<br>\uD83D\uDCCD <b style="color:var(--tx)">'+target.cty+'</b></div>'}
function setBtn(){var b=$('go');
 if(phase==='guess'){b.disabled=!pend;b.textContent=pend?'Lock in guess':'Tap the globe to drop a pin'}
 else if(phase==='result'){b.disabled=false;b.textContent=idx>=N-1?'See results':'Next round \u2192'}
 else{b.disabled=false;b.textContent='Play a practice round'}}
function list(){$('list').innerHTML=rounds.map(function(r,i){return'<div class="g"><i style="background:'+r.col+'"></i><b>'+(i+1)+'. '+r.name+'</b><em>'+fmt(r.d)+' \u00b7 '+r.p.toLocaleString()+'</em></div>'}).join('')}
function seeded(str){var h=1779033703^str.length;for(var i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}
 return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return(h>>>0)/4294967296}}
function pick(){if(daily&&!window.__practice)return DAILY.slice();return ALL.slice().sort(function(){return Math.random()-.5}).slice(0,N)}
function round(){
 pins.selectAll('*').remove();arcs.selectAll('*').remove();pend=null;phase='guess';
 target=set[idx];rot=[Math.random()*360-180,-15];projection.rotate(rot);setZoom(1);
 setClue();setBtn();hud();msg.textContent='Zoom in, then tap the globe to place your pin.'}
function newGame(isDaily){daily=isDaily;window.__practice=!isDaily;
 set=pick();idx=0;total=0;rounds=[];guesses=[];$('namebox').style.display='none';$('list').innerHTML='';round()}
function lock(){
 var d=hav(pend,target),col=scale(d),p=pts(d);total+=p;guesses.push({lat:pend.lat,lon:pend.lon});
 pins.selectAll('circle.pend').remove();addPin(pend,col,8);
 addPin(target,'#fff',9).style('stroke','#2fbf71').style('stroke-width',3.5);
 arcs.append('path').datum({type:'LineString',coordinates:[[pend.lon,pend.lat],[target.lon,target.lat]]})
  .style('fill','none').style('stroke','rgba(255,255,255,.7)').style('stroke-width',1.5).style('stroke-dasharray','4 4');
 var mid=d3.geo.interpolate([pend.lon,pend.lat],[target.lon,target.lat])(.5),th=Math.min(1.2,d/R);
 look({lon:mid[0],lat:mid[1]},Math.max(1,Math.min(12,.7/Math.max(.02,Math.sin(th)))));
 rounds.push({name:target.name,d:d,p:p,col:col});phase='result';
 msg.textContent=(d<=25?'\uD83C\uDFAF Pinpoint! ':'')+'You were '+fmt(d)+' away \u2013 +'+p.toLocaleString()+' points.';
 hud();setBtn();list()}
function finish(){phase='done';var s=total;
 msg.innerHTML='<b style="color:var(--tx);font-size:18px">Final score: '+s.toLocaleString()+' / '+(N*5000).toLocaleString()+'</b><br>'+(s>=20000?'World-class navigator! \uD83C\uDF0D':s>=14000?'Great globetrotting!':s>=8000?'Not bad, keep exploring.':'Time to brush up on your atlas.');
 setBtn();
 if(daily&&!played&&!window.__practice){$('nm').value=localStorage.getItem('terra-name')||'';$('namebox').style.display='block'}}
$('post').onclick=function(){
 var name=$('nm').value.trim()||'Player';localStorage.setItem('terra-name',name);$('post').disabled=true;
 fetch('/api/score',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({clientId:CID,name:name,guesses:guesses})})
  .then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j}})})
  .then(function(x){$('namebox').style.display='none';
   if(x.ok){played=true;hud();msg.innerHTML+='<br><span style="color:var(--acc)">Posted to today\u2019s leaderboard \u2705</span>';loadBoard()}
   else{if(x.j&&x.j.error==='already played today'){played=true;hud()}msg.innerHTML+='<br><span style="color:var(--mut)">Couldn\u2019t post: '+(x.j&&x.j.error||'error')+'</span>'}})
  .catch(function(){$('post').disabled=false;msg.innerHTML+='<br><span style="color:var(--mut)">Network error \u2013 try again.</span>'})};
function advance(){
 if(phase==='guess'){if(pend)lock()}
 else if(phase==='result'){if(idx>=N-1)finish();else{idx++;round()}}
 else newGame(false)}
$('go').onclick=advance;$('again').onclick=function(){newGame(false)};
$('zi').onclick=function(){setZoom(zoom*1.8)};$('zo').onclick=function(){setZoom(zoom/1.8)};
$('zs').oninput=function(){setZoom(Math.exp(this.value/100*Math.log(ZMAX)))};
document.addEventListener('keydown',function(e){if(e.key==='+'||e.key==='=')setZoom(zoom*1.5);if(e.key==='-'||e.key==='_')setZoom(zoom/1.5)});
function loc(e){var r=el.getBoundingClientRect(),k=W/r.width;return[(e.clientX-r.left)*k,(e.clientY-r.top)*k]}
function geo(e){var p=loc(e),q=projection.invert(p);return q&&isFinite(q[0])?q:null}
el.addEventListener('wheel',function(e){e.preventDefault();var f=Math.exp(-e.deltaY*.0035);zoomAt(geo(e),f,f>1?.25:0)},{passive:false});
el.addEventListener('dblclick',function(e){e.preventDefault();zoomAt(geo(e),e.shiftKey?1/2.2:2.2,e.shiftKey?0:.6)});
var P={},moved=0,pinch=0,pd=0,lastTap=0,lastXY=[0,0];
function pdist(){var k=Object.keys(P);return Math.hypot(P[k[0]][0]-P[k[1]][0],P[k[0]][1]-P[k[1]][1])}
el.addEventListener('pointerdown',function(e){P[e.pointerId]=[e.clientX,e.clientY];el.setPointerCapture(e.pointerId);
 if(Object.keys(P).length===1){moved=0;pinch=0}else{pinch=1;pd=pdist()}});
el.addEventListener('pointermove',function(e){if(!P[e.pointerId])return;var o=P[e.pointerId],n=Object.keys(P).length;
 moved+=Math.abs(e.clientX-o[0])+Math.abs(e.clientY-o[1]);P[e.pointerId]=[e.clientX,e.clientY];
 if(n>=2){var nd=pdist();if(pd>0)setZoom(zoom*nd/pd);pd=nd;return}
 var f=.4/zoom;rot=[rot[0]+(e.clientX-o[0])*f,Math.max(-90,Math.min(90,rot[1]-(e.clientY-o[1])*f))];
 projection.rotate(rot);redraw()});
function up(e){delete P[e.pointerId]}
el.addEventListener('pointercancel',up);
el.addEventListener('pointerup',function(e){var had=P[e.pointerId];up(e);
 if(!had||moved>6||pinch)return;
 if(e.pointerType==='touch'){var now=Date.now(),q2=geo(e);
  if(now-lastTap<320&&Math.hypot(e.clientX-lastXY[0],e.clientY-lastXY[1])<30){lastTap=0;zoomAt(q2,2.2,.6);return}
  lastTap=now;lastXY=[e.clientX,e.clientY]}
 if(phase!=='guess')return;
 var q=geo(e);if(!q)return;
 var c=projection.invert([W/2,W/2]);if(d3.geo.distance(c,q)>=Math.PI/2)return;
 pend={lon:q[0],lat:q[1]};pins.selectAll('circle.pend').remove();
 addPin(pend,'#4fb3ff',8,'pend');redraw();setBtn();
 msg.textContent='Pin placed. Lock it in, or tap elsewhere to move it.'});
/* ---------- leaderboard ---------- */
function lbMsg(t){$('lb').innerHTML='<div class="g" style="color:var(--mut)">'+t+'</div>'}
function loadBoard(){
 fetch('/api/leaderboard?clientId='+encodeURIComponent(CID)).then(function(r){return r.json()}).then(function(j){
  if(j.me&&!played){played=true;hud();if(daily&&phase!=='done')msg.textContent='You\u2019ve already posted today ('+j.me.score.toLocaleString()+' pts). This run is just for fun.'}
  if(!j.entries.length){lbMsg('No scores yet today \u2013 be the first!');return}
  $('lb').innerHTML='';
  j.entries.forEach(function(v,i){var row=document.createElement('div'),a=document.createElement('b'),s=document.createElement('em');
   row.className='g'+(v.mine?' new':'');
   a.textContent=(i<3?['\uD83E\uDD47','\uD83E\uDD48','\uD83E\uDD49'][i]:(i+1)+'.')+' '+v.name+(v.mine?' (you)':'');
   s.textContent=v.score.toLocaleString();row.appendChild(a);row.appendChild(s);$('lb').appendChild(row)})
 }).catch(function(){lbMsg('Leaderboard unavailable right now.')})}
fetch('/api/landmarks').then(function(r){return r.json()}).then(function(j){
 ALL=j.all;DAILY=j.daily;TODAY=j.day;newGame(true);loadBoard();setInterval(loadBoard,30000)
}).catch(function(){msg.textContent='Could not load landmarks \u2013 is the /api function deployed?';lbMsg('Leaderboard unavailable.')});
})();
</script></body></html>
